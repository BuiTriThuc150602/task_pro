name: task_your_life
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # UI
  flutter_localizations:
    sdk: flutter
  material_design_icons_flutter: ^7.0.7296

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Dependency Injection
  get_it: ^8.0.3

  # Localization
  easy_localization: ^3.0.3

  # Database
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0

  # Model Generator
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  path_provider: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Freezed build runner
  build_runner: ^2.4.7
  freezed: ^2.4.6

  # Json Serializable generator
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
